<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン – KAGARIHI 会計</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2e3147;
      --accent: #7c6af7; --text: #e8eaf0; --muted: #8b8fa8;
      --discord: #5865F2; --red: #e05c5c; --green: #4caf82;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 48px 40px; text-align: center;
      width: 100%; max-width: 400px;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; line-height: 1.7; }
    .btn-discord {
      display: inline-flex; align-items: center; gap: 12px;
      background: var(--discord); color: #fff;
      padding: 14px 28px; border-radius: 10px;
      text-decoration: none; font-size: 15px; font-weight: 700;
      transition: opacity .15s; width: 100%; justify-content: center;
    }
    .btn-discord:hover { opacity: .85; }
    .btn-discord svg { width: 24px; height: 24px; flex-shrink: 0; }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0; color: var(--muted); font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }
    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px;
    }
    .form-group input {
      width: 100%; background: #0f1117; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text);
      font-size: 14px; outline: none; transition: border-color .15s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn-email {
      width: 100%; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; padding: 13px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .15s; margin-top: 4px;
    }
    .btn-email:hover { opacity: .85; }
    .alert {
      border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 13px;
    }
    .alert-error { background: #3a1a1a; border: 1px solid var(--red); color: var(--red); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎸</div>
    <h1>KAGARIHI 会計</h1>
    <p class="subtitle">バンドの収支をいつでも確認できるダッシュボードです。</p>

    {% if error %}
    <div class="alert alert-error">
      {% if error == "invalid" %}
        メールアドレスまたはパスワードが正しくありません。
      {% else %}
        ログインがキャンセルされました。もう一度お試しください。
      {% endif %}
    </div>
    {% endif %}

    <a href="/auth/login" class="btn-discord">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.102 18.079.114 18.1.13 18.114a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Discord でログイン
    </a>

    <div class="divider">または</div>

    <form method="post" action="/auth/email-login">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-email">メールでログイン</button>
    </form>
  </div>
</body>
</html>
